name: "Jules: Respond to Review"

on:
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  jules-review:
    runs-on: ubuntu-latest
    if: >-
      contains(github.event.review.body || github.event.comment.body, '@Jules')
      && startsWith(github.event.pull_request.head.ref, 'jules/')
    steps:
      - name: Invoke Jules
        uses: google-labs-code/jules-invoke@v1
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: ${{ github.event.pull_request.head.ref }}
          prompt: |
            PR #${{ github.event.pull_request.number }} — a reviewer mentioned you.

            **Comment:**
            ${{ github.event.review.body || github.event.comment.body }}

            Read all review comments on this PR, then follow the
            "Review Feedback Response Protocol" in `AGENTS.md`:

            1. Reply to each comment explaining what you changed
            2. Make focused fix commits: `fix(review): address <topic>`
            3. Do NOT force-push, squash, or resolve comment threads
            4. Re-request review when done
