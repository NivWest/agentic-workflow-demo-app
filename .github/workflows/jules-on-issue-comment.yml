name: "Jules: Answer Issue Questions"

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  jules-answer:
    runs-on: ubuntu-latest
    if: >-
      !github.event.issue.pull_request
      && contains(github.event.comment.body, '@Jules')
      && contains(join(github.event.issue.labels.*.name, ','), 'Jules')
    steps:
      - name: Invoke Jules
        uses: google-labs-code/jules-invoke@v1
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          prompt: |
            Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}

            **Issue description:**
            ${{ github.event.issue.body }}

            **Question from @${{ github.event.comment.user.login }}:**
            ${{ github.event.comment.body }}

            Answer the question based on the codebase and project context.
            Do NOT create branches, make commits, or open PRs.
            Just reply with a helpful, concise answer.
